name: illustration
description: "插畫 / 二次元風格"

stages:
  - name: upscale
    enabled: true
    params:
      method: lanczos
      scale: 2

  - name: style
    enabled: true
    params:
      method: bilateral
      bilateral_d: 7
      bilateral_sigma_color: 50
      bilateral_sigma_space: 50
      iterations: 1

  - name: quantize
    enabled: false
    params:
      method: kmeans
      n_colors: 20
      colorspace: lab

  - name: edge_enhance
    enabled: true
    params:
      method: unsharp_mask
      amount: 1.8
      radius: 1.0
      threshold: 4
